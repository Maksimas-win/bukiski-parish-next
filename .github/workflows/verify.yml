name: Verify source and export site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build and test (documents served directly, as on Apache)
        run: npm run check
        env:
          DOCUMENT_DELIVERY: direct

      - name: Build and test (documents in HTML envelopes, as on GitHub Pages)
        run: npm run check

      # deploy/old-domain.htaccess and content/migration.* are written by the
      # build and reviewed in Git. A difference here means they were not rebuilt
      # and committed after a content change.
      - name: Generated review files are up to date
        run: git diff --exit-code -- deploy content/migration.csv content/migration.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: parish-static-site
          path: dist/
          include-hidden-files: true
          retention-days: 14
