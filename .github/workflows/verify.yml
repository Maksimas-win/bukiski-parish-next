name: Verify source and export site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run check
      - uses: actions/upload-artifact@v7
        with:
          name: parish-static-site
          path: dist/
          include-hidden-files: true
          retention-days: 14
