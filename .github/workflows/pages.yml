name: Deploy test preview to GitHub Pages

# Runs on request and every six hours. Each run fetches the current service
# schedule from the parish feed before building, so the published preview does
# not go stale between manual deployments. Scheduled runs use the defaults below.
on:
  workflow_dispatch:
    inputs:
      origin:
        description: 'HTTPS origin of the test preview'
        default: 'https://maksimas-win.github.io'
        required: true
        type: string
      base_path:
        description: 'Project path, e.g. /bukiski-parish-next; empty for a custom domain'
        default: '/bukiski-parish-next'
        type: string
  schedule:
    - cron: '23 3,9,15,21 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DEFAULT_ORIGIN: 'https://maksimas-win.github.io'
  DEFAULT_BASE_PATH: '/bukiski-parish-next'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      preview_url: ${{ steps.address.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Resolve preview address
        id: address
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ORIGIN: ${{ inputs.origin }}
          INPUT_BASE_PATH: ${{ inputs.base_path }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            origin="$INPUT_ORIGIN"; base_path="$INPUT_BASE_PATH"
          else
            origin="$DEFAULT_ORIGIN"; base_path="$DEFAULT_BASE_PATH"
          fi
          {
            echo "origin=$origin"
            echo "base_path=$base_path"
            echo "preview_url=$origin$base_path/"
          } >> "$GITHUB_OUTPUT"

      # The feed is the JSON the current parish site publishes from its Google
      # Calendar. Override it with the repository variable SCHEDULE_SOURCE_URL.
      - name: Refresh the service schedule from the parish feed
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE_SOURCE_URL: ${{ vars.SCHEDULE_SOURCE_URL || 'https://bukiski-hram.org/data/services.json' }}
        run: |
          if node scripts/sync-schedule.mjs; then
            exit 0
          fi
          if [ "$EVENT" = "schedule" ]; then
            echo "::error::The parish feed could not be read. The published site is left as it is."
            exit 1
          fi
          echo "::warning::The parish feed could not be read. Publishing the snapshot committed in the repository."

      - name: Build and test
        run: npm run check
        env:
          SITE_ORIGIN: ${{ steps.address.outputs.origin }}
          BASE_PATH: ${{ steps.address.outputs.base_path }}
          PRODUCTION: 'false'
          DOCUMENT_DELIVERY: envelope

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify-publication:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify noindex document downloads and retired URLs
        run: node scripts/verify-published.mjs
        env:
          PREVIEW_URL: ${{ needs.build.outputs.preview_url }}
