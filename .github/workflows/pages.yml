name: Deploy test preview to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      origin:
        description: 'HTTPS origin of the test preview'
        default: 'https://maksimas-win.github.io'
        required: true
        type: string
      base_path:
        description: 'Project path, e.g. /bukiski-parish-next; empty for a custom domain'
        default: '/bukiski-parish-next'
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run check
        env:
          SITE_ORIGIN: ${{ inputs.origin }}
          BASE_PATH: ${{ inputs.base_path }}
          PRODUCTION: 'false'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  verify-publication:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify noindex document downloads and retired URLs
        run: node scripts/verify-published.mjs
        env:
          PREVIEW_URL: ${{ inputs.origin }}${{ inputs.base_path }}/
