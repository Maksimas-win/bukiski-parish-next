<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="{{csp}}">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fdfcfa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1a20" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="{{canonical}}">
  {{alternates}}
  <meta property="og:type" content="{{ogType}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:locale" content="{{ogLocale}}">
  <meta property="og:site_name" content="{{siteName}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:image:width" content="{{ogImageWidth}}">
  <meta property="og:image:height" content="{{ogImageHeight}}">
  <meta property="og:image:alt" content="{{ogImageAlt}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{base}}/assets/img/cross.svg?v={{assetVersion}}" type="image/svg+xml">
  <link rel="icon" href="{{base}}/assets/img/icon-180.png" type="image/png" sizes="180x180">
  <link rel="apple-touch-icon" href="{{base}}/assets/img/icon-180.png">
  <link rel="preload" href="{{base}}/assets/fonts/source-sans-3/source-sans-3-roman-v3.052.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{base}}/assets/fonts/source-serif-4/source-serif-4-display-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{base}}/assets/css/site.css?v={{assetVersion}}">
  <script src="{{base}}/assets/js/theme-init.js?v={{assetVersion}}"></script>
  <script src="{{base}}/assets/js/app.js?v={{assetVersion}}" type="module"></script>
  <script type="module" src="{{base}}/assets/js/parish-assistant.js?v={{assetVersion}}" data-parish-assistant-entry data-assistant-site="net" data-assistant-schedule="data/assistant-services.json"></script>
</head>
<body data-locale="{{uiLocale}}" data-root="{{base}}/" data-page="{{page}}"{{bodyAttributes}}>
  <a href="#main" class="skip-link">{{skip}}</a>
  {{svgDefs}}
  {{header}}
  <main id="main" tabindex="-1">{{body}}</main>
  {{footer}}
  {{dialogs}}
</body>
</html>
